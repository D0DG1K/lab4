<p>Текущая дата и время: <span id="clock"></span></p>

<p><a href="main.html">Перейти к проверке точек</a></p>

<script>
    function updateClock() {
        var now = new Date();
        document.getElementById('clock').innerHTML = now.toLocaleString('ru-RU');
    }
    updateClock();
    setInterval(updateClock, 10000);
</script>
